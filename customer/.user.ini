; Golden A/S portal — PHP upload limits (GAS-CP-R76-003). Read by PHP-FPM/CGI every 5 min; cPanel's MultiPHP INI Editor
; values in public_html still apply where larger. Keep in step with up_limits() in app/helpers.php (which reads these).
upload_max_filesize = 20M
