<svg xmlns="http://www.w3.org/2000/svg" width="940" height="230" viewBox="0 0 940 230"><rect width="940" height="230" style="fill:#fff"/><rect x="30" y="20" width="290" height="190" rx="10" style="fill:#fff;stroke:#1F3A5F;stroke-width:1.2"/><text x="175" y="48" text-anchor="middle" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1F3A5F">Owner / customer</text><text x="48" y="78" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Own vessels, projects, tickets</text><text x="48" y="104" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Approve documents, offers, work orders</text><text x="48" y="130" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Accept or dispute service reports</text><text x="48" y="156" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Download issued reports</text><text x="48" y="182" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• No internal notes, no timesheets</text><rect x="335" y="20" width="290" height="190" rx="10" style="fill:#1F3A5F;stroke:#1F3A5F;stroke-width:1.2"/><text x="480" y="48" text-anchor="middle" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#fff">Golden A/S staff</text><text x="353" y="78" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#fff">• Everything the owner sees, for all customers</text><text x="353" y="104" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#fff">• Run projects: stages, notes, files</text><text x="353" y="130" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#fff">• Tickets, work orders, service reports</text><text x="353" y="156" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#fff">• Timesheets, contacts, offers</text><text x="353" y="182" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#fff">• Financial data per role setting</text><rect x="640" y="20" width="290" height="190" rx="10" style="fill:#C9A227;stroke:#1F3A5F;stroke-width:1.2"/><text x="785" y="48" text-anchor="middle" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1F3A5F">Administrator</text><text x="658" y="78" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• All staff rights</text><text x="658" y="104" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Settings: accounts, roles, disciplines</text><text x="658" y="130" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Customers, companies, invoicing details</text><text x="658" y="156" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• Imports / exports, delete records</text><text x="658" y="182" style="font-family:Aptos,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#1F3A5F">• File archive, versions, login history</text></svg>