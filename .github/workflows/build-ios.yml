# Golden A/S mobile apps — iOS build on a GitHub macOS runner, upload to TestFlight.                GAS-CP-R70-001
#
#   Run workflow → app (engineer | pm | customer), testflight (true = upload, false = archive only).
#   Steps: prepare the Capacitor shell → icons / splash → add the iOS project → install the signing certificate and
#          the provisioning profile from the secrets → xcodebuild archive (manual signing) → export .ipa →
#          upload with the App Store Connect API key. Build number = this run number.
#
#   One-time in the Apple account:
#     • App ID (bundle id) per app, capabilities Push Notifications
#     • Distribution certificate (Apple Distribution) exported as .p12 with a password
#     • App Store provisioning profile per app (named e.g. "Golden Service AppStore")
#     • App Store Connect API key (Users and Access › Integrations › App Store Connect API, role App Manager)
#   Secrets:
#     APPLE_TEAM_ID                 10-character team id
#     APPLE_CERT_P12_B64            base64 of the distribution certificate .p12
#     APPLE_CERT_PASSWORD           its password
#     ASC_KEY_ID, ASC_ISSUER_ID     API key id and issuer id
#     ASC_KEY_P8_B64                base64 of the AuthKey_XXXX.p8 file
#   Variables (not secret): IOS_PROFILE_ENGINEER, IOS_PROFILE_PM, IOS_PROFILE_CUSTOMER — the provisioning profile names
name: Build iOS app
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app'
        type: choice
        options: [engineer, pm, customer]
        default: engineer
      testflight:
        description: 'Upload to TestFlight'
        type: boolean
        default: true
concurrency: { group: "ios-${{ github.event.inputs.app }}", cancel-in-progress: false }
jobs:
  ios:
    runs-on: macos-15   # Xcode 16 — required by Capacitor 8
    defaults: { run: { working-directory: mobile-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Prepare the shell (client → www, config, icons)
        id: prep
        run: |
          set -e; npm ci --no-audit --no-fund
          node prepare.js "${{ github.event.inputs.app }}"
          echo "version=$(cat APP_VERSION)" >> "$GITHUB_OUTPUT"
          echo "app_id=$(node -e "console.log(require('./apps.json')['${{ github.event.inputs.app }}'].appId)")" >> "$GITHUB_OUTPUT"
          echo "splash=$(node -e "console.log(require('./apps.json')['${{ github.event.inputs.app }}'].splash)")" >> "$GITHUB_OUTPUT"
          case "${{ github.event.inputs.app }}" in engineer) echo "profile=${{ vars.IOS_PROFILE_ENGINEER }}";; pm) echo "profile=${{ vars.IOS_PROFILE_PM }}";; customer) echo "profile=${{ vars.IOS_PROFILE_CUSTOMER }}";; esac >> "$GITHUB_OUTPUT"
      - name: Add the iOS project
        run: |
          set -e; npx cap add ios
          SPLASH="${{ steps.prep.outputs.splash }}" npx @capacitor/assets generate --ios --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#1F3A5F' --splashBackgroundColor "$SPLASH" --splashBackgroundColorDark "$SPLASH" || echo "assets: default icons kept"
          npx cap sync ios
      - name: Install the signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_B64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Decode the App Store Connect API key
        id: asckey
        env: { K: "${{ secrets.ASC_KEY_P8_B64 }}" }
        run: |
          set -e; [ -n "$K" ] || { echo "ASC_KEY_P8_B64 secret missing"; exit 1; }
          echo "$K" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"; grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8" || { echo "ASC_KEY_P8_B64 is not the base64 of the .p8 file"; exit 1; }
          { echo "pem<<EOFKEY"; cat "$RUNNER_TEMP/AuthKey.p8"; echo; echo "EOFKEY"; } >> "$GITHUB_OUTPUT"
      - name: Download the provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: ${{ steps.prep.outputs.app_id }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ steps.asckey.outputs.pem }}
      - name: Archive and export
        env: { TEAM: "${{ secrets.APPLE_TEAM_ID }}", PROFILE: "${{ steps.prep.outputs.profile }}", APPID: "${{ steps.prep.outputs.app_id }}", VERSION: "${{ steps.prep.outputs.version }}" }
        run: |
          set -e; cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist || true
          sed "s/__TEAM_ID__/$TEAM/; s/__APP_ID__/$APPID/; s/__PROFILE_NAME__/$PROFILE/" ../../ExportOptions.plist > ExportOptions.plist
          if [ -d App.xcworkspace ]; then X="-workspace App.xcworkspace"; else X="-project App.xcodeproj"; fi   # Capacitor 8 templates use SPM (no CocoaPods workspace)
          # manual signing written into the App target only — command-line overrides would also hit the Swift packages, which refuse a provisioning profile
          P=App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g; s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $APPID; DEVELOPMENT_TEAM = $TEAM; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE\"; CODE_SIGN_IDENTITY = \"Apple Distribution\"; MARKETING_VERSION = $VERSION; CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" "$P"
          grep -c "PROVISIONING_PROFILE_SPECIFIER" "$P"
          xcodebuild $X -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive -quiet
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export -quiet
          ls -la build/export; cp build/export/*.ipa "../../$APPID-$VERSION-${{ github.run_number }}.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.app_id }}-${{ steps.prep.outputs.version }}-${{ github.run_number }}
          path: mobile-native/*.ipa
          retention-days: 30
      - name: Upload to TestFlight
        if: ${{ github.event.inputs.testflight == 'true' }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: mobile-native/${{ steps.prep.outputs.app_id }}-${{ steps.prep.outputs.version }}-${{ github.run_number }}.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ steps.asckey.outputs.pem }}
      - name: Summary
        run: echo "### ${{ github.event.inputs.app }} — ${{ steps.prep.outputs.app_id }} ${{ steps.prep.outputs.version }} (build ${{ github.run_number }}) → TestFlight ${{ github.event.inputs.testflight }}" >> "$GITHUB_STEP_SUMMARY"
