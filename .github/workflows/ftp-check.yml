# Diagnostic only: can the runner reach the hosting's FTP and upload? Prints no secret (GitHub masks them); uploads three small test files to storage/updates and removes them.
name: FTP check
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reach the FTP service
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PROTO: ${{ secrets.DEPLOY_PROTOCOL }}
          USER: ${{ secrets.DEPLOY_USER }}
          PASS: ${{ secrets.DEPLOY_PASSWORD }}
          DPATH: ${{ secrets.DEPLOY_PATH }}
          ORIGIN: ${{ secrets.ORIGIN_IP }}
        run: |
          set +e
          H="${HOST%%:*}"
          echo "protocol: ${PROTO:-ftps}"
          if echo "$H" | grep -Eq '^[0-9.]+$'; then echo "host is an IP address"; else echo "host is a name"; fi
          IP=$(getent ahostsv4 "$H" | awk 'NR==1{print $1}')
          [ "$IP" = "92.205.169.92" ] && echo "host resolves to the hosting IP shown in the GoDaddy panel: yes" || echo "host resolves to the hosting IP shown in the GoDaddy panel: NO"
          echo "runner public IP: $(curl -s -m 8 https://api.ipify.org)"
          for p in 21 22 443 2083; do timeout 8 bash -c "exec 3<>/dev/tcp/$H/$p" 2>/dev/null && echo "port $p: open" || echo "port $p: closed or filtered"; done
          echo "--- banner on port 21 (no login)"
          timeout 8 bash -c "exec 3<>/dev/tcp/$H/21 && head -c 200 <&3" 2>&1 | tr -d '\r' | head -3
          echo "--- explicit TLS, no login"
          curl -sS -m 15 --ssl-reqd "ftp://$H/" -u "anonymous:x" -o /dev/null -w "curl exit code will follow\n" 2>&1 | sed 's/^/  /' | head -5; echo "  exit ${PIPESTATUS[0]}"
          echo "--- explicit TLS, deploy account, list only"
          curl -sS -m 20 --ssl-reqd "ftp://$H/" -u "$USER:$PASS" -l -o /dev/null 2>&1 | sed 's/^/  /' | head -5; echo "  exit ${PIPESTATUS[0]}"
          echo "--- plain FTP greeting only (no login sent)"
          curl -sS -m 10 "ftp://$H/" -u "anonymous:x" -o /dev/null 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          echo "--- the website asked directly at the hosting server (not through the firewall)"
          O=$(echo "$ORIGIN" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#[/:].*$##'); echo "$O" | grep -Eq '^[0-9.]+$' || O=$(getent ahostsv4 "$O" | awk 'NR==1{print $1}')
          [ "$O" = "92.205.169.92" ] && echo "  ORIGIN_IP is the hosting IP of the panel: yes" || echo "  ORIGIN_IP is the hosting IP of the panel: NO"
          for i in 1 2 3; do curl -s -o /dev/null -m 40 --resolve "goldensas.com:443:$O" -A "GAS-deploy/1.0" -w "  direct GET login: %{http_code} connect %{time_connect}s tls %{time_appconnect}s total %{time_total}s\n" "https://goldensas.com/customer/?p=login"; done
          curl -s -o /dev/null -m 40 --resolve "goldensas.com:443:$O" -A "GAS-deploy/1.0" -w "  direct GET static file: %{http_code} total %{time_total}s\n" "https://goldensas.com/customer/assets/portal.css"
          curl -s -o /dev/null -m 40 --resolve "goldensas.com:443:$O" -A "GAS-deploy/1.0" -X POST -d "dry=1" -w "  direct POST update.php without token: %{http_code} total %{time_total}s\n" "https://goldensas.com/customer/install/update.php"
          curl -s -o /dev/null -m 40 -A "GAS-deploy/1.0" -w "  through the firewall GET login: %{http_code} total %{time_total}s\n" "https://goldensas.com/customer/?p=login"
          DEST="${DPATH%/}/customer/storage/updates/"
          v() { grep -E "^(< [0-9]{3}|\* (TLS|SSL|Connect|Closing|Recv|Send|Fail|Remembering|upload|We are|Connection))" | sed 's/^/    /' | grep -v "PASS\|USER" | head -40; }
          echo "--- list the updates folder"
          curl -sS -m 25 --ssl-reqd "ftp://$HOST$DEST" -u "$USER:$PASS" -l 2>&1 | wc -l | sed 's/^/  entries: /'
          echo "--- upload a 20-byte file"
          echo "ftp check $(date -u +%H:%M)" > /tmp/ftpcheck.txt
          curl -v -sS -m 30 --ssl-reqd -T /tmp/ftpcheck.txt "ftp://$HOST$DEST" -u "$USER:$PASS" 2>&1 | v; echo "  exit ${PIPESTATUS[0]}"
          echo "--- upload a 20-byte file, EPSV off"
          curl -v -sS -m 30 --ssl-reqd --disable-epsv -T /tmp/ftpcheck.txt "ftp://$HOST$DEST" -u "$USER:$PASS" 2>&1 | v; echo "  exit ${PIPESTATUS[0]}"
          echo "--- upload a 3 MB file"
          head -c 3000000 /dev/urandom > /tmp/ftpcheck.bin
          curl -sS -m 90 --ssl-reqd -T /tmp/ftpcheck.bin "ftp://$HOST$DEST" -u "$USER:$PASS" 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          echo "--- upload a 3 MB file named .zip"
          cp /tmp/ftpcheck.bin /tmp/ftpcheck.zip
          curl -sS -m 90 --ssl-reqd -T /tmp/ftpcheck.zip "ftp://$HOST$DEST" -u "$USER:$PASS" 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          echo "--- upload 15 MB of random data"
          head -c 15000000 /dev/urandom > /tmp/ftpcheck15.bin
          curl -sS -m 120 --ssl-reqd -T /tmp/ftpcheck15.bin "ftp://$HOST$DEST" -u "$USER:$PASS" 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          echo "--- upload a real zip of PHP files (customer/app)"
          (cd "$GITHUB_WORKSPACE" && zip -qr /tmp/ftpcheck-php.zip customer/app -x 'customer/app/config.php'); ls -la /tmp/ftpcheck-php.zip | awk '{print "  size " $5}'
          curl -v -sS -m 120 --ssl-reqd -T /tmp/ftpcheck-php.zip "ftp://$HOST$DEST" -u "$USER:$PASS" 2>&1 | grep -E "^(< (1|2|4|5)[0-9]{2} |\* (Recv|Send|Fail|Closing|upload|We are|Connection #))" | grep -v "PASS\|USER\|220\|234\|331\|230\|200\|257\|250" | sed 's/^/    /' | tail -8; echo "  exit ${PIPESTATUS[0]}"
          echo "--- the same zip with create-dirs, as the deploy does"
          cp /tmp/ftpcheck-php.zip /tmp/ftpcheck-php2.zip
          curl -sS -m 120 --ssl-reqd -T /tmp/ftpcheck-php2.zip "ftp://$HOST$DEST" -u "$USER:$PASS" --ftp-create-dirs 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          echo "--- one PHP file alone"
          curl -sS -m 60 --ssl-reqd -T "$GITHUB_WORKSPACE/customer/app/version.php" "ftp://$HOST${DEST}ftpcheck-version.txt" -u "$USER:$PASS" 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          echo "--- remove the test files"
          curl -sS -m 25 --ssl-reqd "ftp://$HOST$DEST" -u "$USER:$PASS" -l -o /dev/null -Q "-DELE ftpcheck.txt" -Q "-DELE ftpcheck.bin" -Q "-DELE ftpcheck.zip" -Q "-DELE ftpcheck15.bin" -Q "-DELE ftpcheck-php.zip" -Q "-DELE ftpcheck-php2.zip" -Q "-DELE ftpcheck-version.txt" 2>&1 | sed 's/^/  /' | head -3; echo "  exit ${PIPESTATUS[0]}"
          exit 0
